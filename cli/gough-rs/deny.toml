# cargo-deny policy for the gough CLI workspace. Every section is gating (no || true).
[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { crate = "openssl", reason = "rustls only; no OpenSSL linkage" },
    { crate = "openssl-sys", reason = "rustls only; no OpenSSL linkage" },
    { crate = "native-tls", reason = "rustls only; no platform TLS" },
    { crate = "serde_yaml", reason = "archived upstream; use serde_norway" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
