[workspace]
resolver = "3"
members = [
    "crates/gough-cli",
    "crates/gough-core",
    "crates/gough-api",
    "crates/gough-auth",
    "crates/gough-telemetry",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.dependencies]
async-trait = "=0.1.92"
clap = { version = "=4.6.7", features = ["derive", "std", "help", "usage", "error-context"], default-features = false }
clap_complete = "=4.6.11"
comfy-table = "=8.0.1"
fastrand = "=2.4.1"
httpdate = "=1.0.3"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "query", "http2"] }
secrecy = "=0.10.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_json_path = "=0.7.2"
serde_norway = "=0.9.42"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["rt", "macros", "time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.20", default-features = false, features = ["fmt", "std"] }
url = "=2.5.8"
tempfile = "=3.27.0"
assert_cmd = "=2.2.2"
insta = "=1.49.0"
predicates = "=3.1.4"
rstest = "=0.28.0"
wiremock = "=0.6.5"
gough-api = { path = "crates/gough-api", version = "=0.1.0" }
gough-core = { path = "crates/gough-core", version = "=0.1.0" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
