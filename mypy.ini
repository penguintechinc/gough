[mypy]
# DECISION: tests/ stays excluded from mypy. Tried explicit_package_bases + namespace_packages:
# mypy still aborts with "Duplicate module named tests" because tests/, services/api-manager/tests,
# services/access-agent/tests and services/worker-ipxe/tests all define top-level "tests"/"conftest",
# and hyphenated service dirs (api-manager, flask-backend) cannot be module names. Including tests
# would need renaming test packages, which is out of scope. Test code is still covered by ruff
# (check + format) in the ratchet.
exclude = (^|/)(tests|flask-backend|node_modules|\.worktrees|\.claude)/
