# Default gitleaks rules plus path allowlist for vendored/generated dirs.
# The gate scans the working tree (--no-git), so local venvs would otherwise be scanned.
[extend]
useDefault = true

[[allowlists]]
description = "vendored and generated directories"
paths = [
  '''(^|/)\.venv/''',
  '''(^|/)venv/''',
  '''(^|/)node_modules/''',
  '''(^|/)\.worktrees/''',
  '''(^|/)\.mypy_cache/''',
  # generated coverage reports embed copies of the scanned source
  '''(^|/)htmlcov[^/]*/''',
  '''^tests/reports/''',
  '''(^|/)coverage[^/]*\.(xml|json)$''',
]

# Fixture/placeholder allowlists, scoped per rule id with condition = "AND": a finding
# is suppressed only when BOTH its path AND its secret value match.
# They are deliberately RULE-level, not global [[allowlists]]: in gitleaks 8.30 --no-git
# (directory) mode a global allowlist whose `paths` match skips the whole file at walk
# time and ignores `condition`/`regexes`, which would hide any real secret in those files.
# Each B (test-fixture) value was verified absent from runnable (non-test) code.
# ENROLL\w* was narrowed to the exact fixture literals (ENROLL- is the real key format
# generated by app/api/agents.py); as_dict=True was dropped (occurs in runnable code).
# k8s/manifests/secrets.yaml and the kustomize overlay literals are intentionally NOT
# allowlisted (real defects, fixed on another branch).

[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "A: docs placeholders"
condition = "AND"
paths = ['''^docs/(api/management-server|security/overview|standards/(ARCHITECTURE|AUTHENTICATION|SECURITY))\.md$''']
regexes = ['''YOUR_[A-Z_]*HERE''', '''^eyJ[A-Za-z0-9]{0,60}\.\.\.$''', '''ghp_\w{0,10}XYZ''', '''sk-[\w-]{0,8}abc123''', '''gough_\w*abcdef''']
[[rules.allowlists]]
description = "B: fake enrollment/API keys, JWT secrets and mock tokens in api-manager tests"
condition = "AND"
paths = ['''^services/api-manager/tests/.*\.py$''']
regexes = ['''ENROLL-1234-5678[\w-]*''', '''ENROLL-RACE-TEST-KEY-\d+''', '''ENROLL-SEQUENTIAL-TEST-KEY-\d+''', '''test-[\w-]*-ok''', '''Ymlu\w*=''', '''eyJ[A-Za-z0-9._-]*''']
[[rules.allowlists]]
description = "B: rate-limit test fixtures"
condition = "AND"
paths = ['''^tests/unit/test_rate_limit\.py$''']
regexes = ['''enr_\w*abcdef''', '''invalid\w*12345''', '''test\w*12345''']
[[rules.allowlists]]
description = "B (history): biome/lxd-k8s test fixtures abcd..cdef join tokens, 0123..4567 fingerprints"
condition = "AND"
paths = ['''^(biomes/tests|scripts/lxd-k8s/tests|services/access-agent/tests)/''']
regexes = ['''abcd\w*cdef''', '''ABCD\w*cdef''', '''0123456789abcdef\w*4567''', '''tok-\w*Z987''', '''ed25519\w*Key''']
[[rules.allowlists]]
description = "B: fake sk_test_ strings in CLI client tests (not Stripe; product does not use Stripe)"
condition = "AND"
paths = ['''^cli/gough/internal/client/client_test\.go$''']
regexes = ['''sk_test_\w{8,20}''']

[[rules]]
id = "curl-auth-header"
[[rules.allowlists]]
description = "A: docs placeholders"
condition = "AND"
paths = ['''^docs/(api/management-server|security/overview|standards/(ARCHITECTURE|AUTHENTICATION|SECURITY))\.md$''']
regexes = ['''YOUR_[A-Z_]*HERE''', '''^eyJ[A-Za-z0-9]{0,60}\.\.\.$''', '''ghp_\w{0,10}XYZ''', '''sk-[\w-]{0,8}abc123''', '''gough_\w*abcdef''']

[[rules]]
id = "jwt"
[[rules.allowlists]]
description = "B: mock JWTs in api-manager tests"
condition = "AND"
paths = ['''^services/api-manager/tests/.*\.py$''']
regexes = ['''eyJ[A-Za-z0-9._-]*''']

[[rules]]
id = "private-key"
[[rules.allowlists]]
description = "B: generated throwaway PEM keys used only by SPIRE unit tests"
condition = "AND"
paths = ['''^services/api-manager/tests/test_spire(_client_coverage)?\.py$''']
regexes = ['''-----BEGIN (EC |RSA )?PRIVATE KEY-----''']

[[rules]]
id = "stripe-access-token"
[[rules.allowlists]]
description = "B: fake sk_test_ strings in CLI client tests (not Stripe; product does not use Stripe)"
condition = "AND"
paths = ['''^cli/gough/internal/client/client_test\.go$''']
regexes = ['''sk_test_\w{8,20}''']
