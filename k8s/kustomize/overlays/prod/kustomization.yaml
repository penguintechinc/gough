---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: project-template-prod

namespace: project-template-prod

namePrefix: prod-

commonLabels:
  environment: production

bases:
- ../../base

replicas:
- name: flask-backend
  count: 3
- name: go-backend
  count: 3
- name: webui
  count: 2

configMapGenerator:
- name: project-template-config
  behavior: merge
  literals:
  - LOG_LEVEL=WARN
  - RELEASE_MODE=true

# No secretGenerator: secret values are never committed. Create the
# Secret out-of-band (ESO / Sealed Secrets / kubectl) -- see
# docs/KUBERNETES.md "Required Secrets".
