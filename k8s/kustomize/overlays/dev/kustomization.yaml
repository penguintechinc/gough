---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: project-template-dev

namespace: project-template-dev

namePrefix: dev-

commonLabels:
  environment: development

bases:
- ../../base

replicas:
- name: flask-backend
  count: 1
- name: go-backend
  count: 1
- name: webui
  count: 1

configMapGenerator:
- name: project-template-config
  behavior: merge
  literals:
  - LOG_LEVEL=DEBUG
  - RELEASE_MODE=false

# No secretGenerator: secret values are never committed. Create the
# Secret out-of-band (ESO / Sealed Secrets / kubectl) -- see
# docs/KUBERNETES.md "Required Secrets".
