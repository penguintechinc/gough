---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: project-template-staging

namespace: project-template-staging

namePrefix: staging-

commonLabels:
  environment: staging

bases:
- ../../base

replicas:
- name: flask-backend
  count: 2
- name: go-backend
  count: 2
- name: webui
  count: 1

configMapGenerator:
- name: project-template-config
  behavior: merge
  literals:
  - LOG_LEVEL=INFO
  - RELEASE_MODE=false

# No secretGenerator: secret values are never committed. Create the
# Secret out-of-band (ESO / Sealed Secrets / kubectl) -- see
# docs/KUBERNETES.md "Required Secrets".
