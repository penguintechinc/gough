replicaCount: 1

image:
  repository: ghcr.io/penguintechinc/gough/webui
  pullPolicy: IfNotPresent
  # empty = use global.imageTag (umbrella chart) or Chart.AppVersion
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

# Seconds kubelet waits after SIGTERM; preStop sleeps 5s first so the LB drains.
terminationGracePeriodSeconds: 30

# OTLP destination comes from standard OTEL_* env vars; empty = exporter disabled.
otel:
  endpoint: ""
  serviceName: "webui"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 80
  targetPort: 3000
  annotations: {}

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

httproute:
  enabled: false
  gatewayName: shared
  gatewayNamespace: gateway
  host: ""
  rules: []

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

env:
  - name: NODE_ENV
    value: "production"
  - name: PORT
    value: "3000"
  - name: REACT_APP_API_URL
    valueFrom:
      configMapKeyRef:
        name: webui-config
        key: api-url
  - name: REACT_APP_API_VERSION
    valueFrom:
      configMapKeyRef:
        name: webui-config
        key: api-version
  - name: REACT_APP_THEME
    valueFrom:
      configMapKeyRef:
        name: webui-config
        key: theme
  - name: LICENSE_SERVER_URL
    valueFrom:
      configMapKeyRef:
        name: webui-config
        key: license-server-url
  - name: RELEASE_MODE
    valueFrom:
      configMapKeyRef:
        name: webui-config
        key: release-mode

livenessProbe:
  httpGet:
    path: /healthz
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: 3000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

volumeMounts: []

volumes: []

configMapData:
  api-url: "http://api-manager:8080"
  api-version: "v1"
  theme: "gold"
  license-server-url: "https://license.penguintech.io"
  release-mode: "false"
