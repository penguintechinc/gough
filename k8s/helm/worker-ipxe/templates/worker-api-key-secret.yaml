{{- /*
Generated WORKER_API_KEY. The value is created once with randAlphaNum and then
re-read from the live Secret via lookup on every upgrade, so it is stable across
releases and never a literal in values. (lookup is empty under `helm template` /
`--dry-run`, where a throwaway value is rendered; the cluster copy is authoritative.)
*/ -}}
{{- if .Values.workerApiKey.generate }}
{{- $name := printf "%s-auth" (include "worker-ipxe.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $key := randAlphaNum 48 | b64enc }}
{{- if and $existing $existing.data }}
{{- $key = index $existing.data "worker-api-key" | default $key }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "worker-ipxe.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  worker-api-key: {{ $key }}
{{- end }}
