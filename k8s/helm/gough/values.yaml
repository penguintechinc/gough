# Umbrella baseline (prod-safe). Environment overrides live in alpha.yml,
# beta.yml, gamma.yml, production.yml. Subchart keys below pass through to
# api-manager / webui / worker-ipxe.

global:
  # Image tag for every gough service (ghcr.io/penguintechinc/gough/<svc>:<tag>).
  # REQUIRED: set per env in the env file or via --set global.imageTag=<tag>.
  imageTag: ""
  # Replaces the registry+org of every service image (e.g. ghcr.io/penguintechinc/gough for alpha).
  # Empty = subchart repository defaults (ghcr.io/penguintechinc/gough/<svc>) for beta/gamma/prod.
  imageRegistry: ""
  # Pull secrets attached to every hub pod spec (api-manager, webui, worker-ipxe, postgres, redis).
  # Alpha (dal2alpha): ghcr.io pulls need the `ghcr-pull` dockerconfigjson Secret (created by scripts/deploy-alpha.sh).
  imagePullSecrets: []
  # LXD cluster primary used by api-manager's cluster-join endpoint. Empty apiUrl = endpoint returns 503.
  # Must be https://. Client cert Secret must hold tls.crt and tls.key (mounted read-only at /etc/gough/lxd).
  lxd:
    apiUrl: ""
    verifySsl: true
    clientCertSecretRef:
      name: ""
    # Optional CA bundle Secret with key ca.crt (mounted at /etc/gough/lxd-ca).
    caSecretRef:
      name: ""
  # Air-gap mirrors read by api-manager (GOUGH_* env). Empty values render no env.
  # Every URL must be https:// unless allowInsecure=true (fails the render otherwise).
  mirrors:
    allowInsecure: false
    registry: ""              # GOUGH_REGISTRY_MIRROR
    registries: []            # GOUGH_MIRRORED_REGISTRIES (comma-joined)
    chartUrl: ""              # GOUGH_CHART_MIRROR_URL
    fileUrl: ""               # GOUGH_FILE_MIRROR_URL
    # GOUGH_BUNDLE_MIRROR_HOSTS (comma-joined). Empty list = no env: hub allows the hosts of
    # chartUrl/fileUrl. [""] = blank env: hub REJECTS ALL bundle imports.
    bundleHosts: []
    # Optional cosign key reference for biome bundle verification (GOUGH_BIOME_BUNDLE_COSIGN_KEY).
    cosignKeySecretRef:
      name: ""
      key: cosign-key
  # One-time bootstrap enrollment key seeded into api-manager. Generated (>=48 chars) when
  # existingSecret is empty; the Secret must contain key `token`. ttlHours must be 1-24.
  bootstrapToken:
    existingSecret: ""
    ttlHours: 24
  # External S3-compatible storage (AWS S3, MinIO, ...). Consumed by worker-ipxe
  # (boot images + biome artifacts). api-manager storage is configured per tenant
  # through its API/DB, not via env, so it has no entry here.
  objectStorage:
    endpoint: ""              # e.g. https://s3.us-east-1.amazonaws.com; REQUIRED when worker-ipxe.enabled
    useSsl: true
    bucketBootImages: boot-images
    bucketBiomes: biomes
    # Preferred: reference a Secret that already exists in the namespace.
    accessKeySecretRef:
      name: ""                # e.g. gough-object-storage
      accessKeyKey: access-key
      secretKeyKey: secret-key
    # Dev-only inline alternative (--set-string); never commit values.
    accessKey: ""
    secretKey: ""

# OIDC ES256 signing keystore mounted by api-manager (penguin-aaa FileKeyStore:
# {"keys":[{"kid","pem"}]}, EC P-256). Generated in-chart on first install and
# kept across upgrades via lookup. generate=false requires the Secret to exist.
oidcKeystore:
  generate: true
  secretName: api-manager-oidc-keystore

# Subcharts keep the literal Secret/ConfigMap/Service names their values reference
# (api-manager-secret, api-manager-config, ...), so fullnameOverride pins them.
api-manager:
  enabled: true
  fullnameOverride: api-manager
  keystoreSecret:
    create: false           # umbrella renders api-manager-oidc-keystore (oidcKeystore)
  image:
    pullPolicy: IfNotPresent

webui:
  enabled: true
  fullnameOverride: webui
  image:
    pullPolicy: IfNotPresent

worker-ipxe:
  # Alpha disables this: the lab provisions via USB/MaaS, not gough PXE.
  enabled: true
  fullnameOverride: worker-ipxe
  image:
    pullPolicy: IfNotPresent
  # WORKER_API_KEY and REDIS_URL come from the umbrella-generated Secret worker-ipxe-secret
  # (worker-api-key, redis-url -> in-chart Valkey incl. its password, or externalRedisUrl).
  workerApiKey:
    generate: false
    existingSecret: worker-ipxe-secret
  configMapData:
    # CIDRs of reverse proxies whose X-Forwarded-For the worker may trust. Booting hardware
    # reaches the worker directly, so the default trusts none; set e.g. "10.0.0.0/8" if an LB fronts it.
    trusted-proxies: ""

# Tetragon TracingPolicyNamespaced exec allowlists (mandatory baseline).
# Assumes Tetragon >= 1.1: policies hook security_bprm_creds_for_exec (LSM; covers execve + execveat)
# and match the resolved linux_binprm path. memfd-backed exec (/memfd:) is always denied.
# Each workload may exec only the binaries listed; anything else is SIGKILLed.
# Requires the Tetragon CRDs; when disabled nothing is rendered.
# Allowlists were derived from image entrypoints and probe commands - validate on a
# live cluster before enforcing in a new env. api-manager shell sessions spawn a shell
# and will be killed by this policy; that feature needs an explicit exception.
tetragon:
  enabled: true
  policies:
    api-manager:
      selector: {app.kubernetes.io/name: api-manager}
      allowed:
        - /usr/local/bin/python
        - /usr/local/bin/python3
        - /usr/local/bin/python3.13
        - /bin/sleep
    webui:
      selector: {app.kubernetes.io/name: webui}
      allowed:
        - /usr/local/bin/node
        - /bin/sleep
    worker-ipxe:
      selector: {app.kubernetes.io/name: worker-ipxe}
      allowed:
        - /usr/local/bin/python
        - /usr/local/bin/python3
        - /usr/local/bin/python3.13
        - /bin/sleep
    postgres:
      selector: {app.kubernetes.io/name: postgres}
      allowed:
        - /bin/sh
        - /usr/local/bin/docker-entrypoint.sh
        - /usr/lib/postgresql/17/bin/postgres
        - /usr/lib/postgresql/17/bin/initdb
        - /usr/lib/postgresql/17/bin/pg_isready
        - /usr/bin/pg_isready
        - /usr/bin/id
        - /usr/bin/mkdir
        - /usr/bin/chmod
        - /usr/bin/find
        - /bin/sleep
    redis:
      selector: {app.kubernetes.io/name: redis}
      allowed:
        - /bin/sh
        - /usr/local/bin/docker-entrypoint.sh
        - /usr/local/bin/valkey-server
        - /usr/local/bin/valkey-cli
        - /usr/bin/grep
        - /bin/sleep

# In-chart PostgreSQL (StatefulSet). Non-prod only - production uses a managed
# database: set postgresql.enabled=false, fill externalDatabase, and set
# api-manager.configMapData.db-host to the external host.
# STATEFUL EXCEPTION (approved)
postgresql:
  enabled: true
  image:
    repository: docker.io/library/postgres
    tag: 17-bookworm
    # Multi-arch index digest: docker buildx imagetools inspect postgres:17-bookworm
    digest: sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    pullPolicy: IfNotPresent
  database: gough_api
  username: gough_api
  storageSize: 10Gi
  storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# In-chart cache (Valkey, Redis-protocol compatible; redis-py clients work unchanged).
# Keys stay `redis.*` for compatibility with the api-manager env wiring.
# STATEFUL EXCEPTION (approved)
redis:
  enabled: true
  image:
    repository: docker.io/valkey/valkey
    tag: "8-bookworm"
    # Multi-arch index digest: docker buildx imagetools inspect valkey/valkey:8-bookworm
    digest: sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
    pullPolicy: IfNotPresent
  storageSize: 1Gi
  storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# Used only when the matching in-chart component is disabled.
# Credentials are supplied at install time (--set-file / CI secret), never committed.
externalDatabase:
  user: ""
  password: ""
externalRedisUrl: ""   # full URL incl. password, e.g. rediss://:<pw>@host:6380/0

# Application secrets supplied at install time; never committed.
secrets:
  licenseKey: ""

# Namespace of the ingress controller allowed to reach api-manager and webui.
ingressController:
  namespace: ingress
