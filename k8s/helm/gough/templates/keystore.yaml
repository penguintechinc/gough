{{- /*
ES256 OIDC signing keystore for api-manager (penguin-aaa FileKeyStore format:
{"keys":[{"kid":"...","pem":"<EC P-256 private key PEM>"}]}).
Generated once and persisted: an existing Secret's key is reused on every upgrade,
so tokens stay verifiable across helm upgrades. Key material never appears in values.
*/ -}}
{{- $name := .Values.oidcKeystore.secretName }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name | default dict }}
{{- $existingData := $existing.data | default dict }}
{{- $keyJSON := "" }}
{{- if get $existingData "oidc_keys.json" }}
  {{- $keyJSON = b64dec (get $existingData "oidc_keys.json") }}
{{- else if .Values.oidcKeystore.generate }}
  {{- $pem := genPrivateKey "ecdsa" }}
  {{- $keyJSON = dict "keys" (list (dict "kid" (randAlphaNum 16) "pem" $pem)) | toJson }}
{{- else }}
  {{- fail (printf "oidcKeystore.generate=false but Secret %s with key oidc_keys.json is missing" $name) }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gough.labels" . | nindent 4 }}
type: Opaque
data:
  oidc_keys.json: {{ $keyJSON | b64enc | quote }}
