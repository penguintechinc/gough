{{- include "gough.requireImageTag" . }}
{{- /*
Secrets consumed by subcharts (literal names pinned by the subchart values) and by the
in-chart Postgres/Redis StatefulSets. Generated values persist across upgrades via lookup.
Never hardcoded; `helm template` (no cluster) regenerates them, which is expected.
*/ -}}
{{- $api := lookup "v1" "Secret" .Release.Namespace "api-manager-secret" | default dict }}
{{- $apiData := $api.data | default dict }}
{{- $secretKey := include "gough.keepOrGenerate" (dict "data" $apiData "key" "secret-key" "length" 64) }}
{{- $passwordSalt := include "gough.keepOrGenerate" (dict "data" $apiData "key" "password-salt" "length" 64) }}
{{- $generatedDbPass := include "gough.keepOrGenerate" (dict "data" $apiData "key" "db-pass" "length" 40) }}
{{- $redisPass := include "gough.keepOrGenerate" (dict "data" $apiData "key" "redis-password" "length" 48) }}
{{- $adminPass := include "gough.keepOrGenerate" (dict "data" $apiData "key" "admin-password" "length" 32) }}
{{- $dbPass := ternary $generatedDbPass .Values.externalDatabase.password .Values.postgresql.enabled }}
{{- $dbUser := ternary .Values.postgresql.username .Values.externalDatabase.user .Values.postgresql.enabled }}
{{- $redisUrl := ternary (printf "redis://:%s@redis:6379/0" $redisPass) .Values.externalRedisUrl .Values.redis.enabled }}
{{- $os := .Values.global.objectStorage }}
{{- $wrk := lookup "v1" "Secret" .Release.Namespace "worker-ipxe-secret" | default dict }}
{{- $wrkData := $wrk.data | default dict }}
{{- $workerKey := include "gough.keepOrGenerate" (dict "data" $wrkData "key" "worker-api-key" "length" 48) }}
{{- /* Object storage: inline dev value wins, else read the referenced existing Secret. */ -}}
{{- $storageAccess := $os.accessKey }}
{{- $storageSecret := $os.secretKey }}
{{- if (index .Values "worker-ipxe").enabled }}
  {{- if not $os.endpoint }}
    {{- fail "global.objectStorage.endpoint is required when worker-ipxe.enabled=true (set it in the env file, or disable worker-ipxe)" }}
  {{- end }}
  {{- if $os.accessKeySecretRef.name }}
    {{- $ext := lookup "v1" "Secret" .Release.Namespace $os.accessKeySecretRef.name | default dict }}
    {{- $extData := $ext.data | default dict }}
    {{- if not $storageAccess }}{{ $storageAccess = b64dec (get $extData $os.accessKeySecretRef.accessKeyKey) }}{{ end }}
    {{- if not $storageSecret }}{{ $storageSecret = b64dec (get $extData $os.accessKeySecretRef.secretKeyKey) }}{{ end }}
  {{- end }}
  {{- if or (not $storageAccess) (not $storageSecret) }}
    {{- fail "object storage credentials missing: set global.objectStorage.accessKeySecretRef.name (existing Secret) or inline accessKey/secretKey" }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: api-manager-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gough.labels" . | nindent 4 }}
type: Opaque
data:
  secret-key: {{ $secretKey | b64enc | quote }}
  password-salt: {{ $passwordSalt | b64enc | quote }}
  db-user: {{ $dbUser | b64enc | quote }}
  db-pass: {{ $dbPass | b64enc | quote }}
  redis-password: {{ $redisPass | b64enc | quote }}
  redis-url: {{ $redisUrl | b64enc | quote }}
  admin-password: {{ $adminPass | b64enc | quote }}
  license-key: {{ .Values.secrets.licenseKey | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: worker-ipxe-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gough.labels" . | nindent 4 }}
type: Opaque
data:
  worker-api-key: {{ $workerKey | b64enc | quote }}
  redis-url: {{ $redisUrl | b64enc | quote }}
  storage-access-key: {{ $storageAccess | default "" | b64enc | quote }}
  storage-secret-key: {{ $storageSecret | default "" | b64enc | quote }}
{{- if not .Values.global.bootstrapToken.existingSecret }}
{{- $bs := lookup "v1" "Secret" .Release.Namespace "gough-bootstrap-token" | default dict }}
{{- $bsData := $bs.data | default dict }}
{{- $bootToken := include "gough.keepOrGenerate" (dict "data" $bsData "key" "token" "length" 64) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: gough-bootstrap-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gough.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ $bootToken | b64enc | quote }}
{{- end }}
