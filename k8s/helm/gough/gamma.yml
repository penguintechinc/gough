# Gamma: DigitalOcean (context TBD). Upgrade-in-place tier, deployed from a pre-release.
# global.imageTag MUST be passed by CI: --set global.imageTag=gamma-<epoch64>
namespace: gough

api-manager:
  # Pinned to 1: shell sessions are process-local (see https://github.com/penguintechinc/gough/issues/43).
  replicaCount: 1
  autoscaling:
    enabled: false
  image:
    pullPolicy: IfNotPresent
  configMapData:
    release-mode: "false"
    oidc-issuer: "https://gough-gamma.penguintech.cloud"
  ingress:
    enabled: true
    className: "nginx"
    hosts:
      - host: gough-gamma.penguintech.cloud
        paths:
          - path: /api/v1
            pathType: Prefix
    tls: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

webui:
  replicaCount: 1
  image:
    pullPolicy: IfNotPresent
  ingress:
    enabled: true
    className: "nginx"
    hosts:
      - host: gough-gamma.penguintech.cloud
        paths:
          - path: /
            pathType: Prefix
    tls: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

worker-ipxe:
  replicaCount: 1
  image:
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

postgresql:
  enabled: true
redis:
  enabled: true
